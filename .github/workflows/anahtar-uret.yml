name: Imza anahtari uret
on:
  workflow_dispatch:
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - name: Anahtar uret
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "KS_PASS sirri tanimli degil"; exit 1; fi
          keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias ceviri \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Canli Ceviri"
          base64 -w 0 release.jks > release.b64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: imza-anahtari
          path: release.b64.txt
          retention-days: 1
